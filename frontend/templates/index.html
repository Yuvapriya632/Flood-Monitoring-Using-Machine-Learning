{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>SG</title>
  <script src="https://kit.fontawesome.com/47101d2035.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" crossorigin="anonymous">
  <style>
      body {
      margin: 0;
      padding: 0;
      background: url('{% static "images/i.jpg" %}') no-repeat center center fixed; 
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: space-between; /* Align items and create space between them */
      height: 140vh;
    }
    
    .form-container {
      width: 60%;
      background-color: rgba(49, 48, 48, 0.8); /* Semi-transparent white background */
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2); /* Box shadow for a card-like appearance */
    }

    .form-label {
      font-weight: bold;
      text-transform: uppercase;
      color: #ebedf0; /* Dark blue color */
    }

    h3 {
      color: #130101; /* Dark purple color */
      text-align: center;
      font-weight: 500;
      font-size: 35px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      margin-bottom: 10px;
      position: relative;
      left: 15px;
    }

    .btn-primary {
      background-color: #e74c3c; /* Red color for the button */
      border-color: #e74c3c;
    }

    .btn-primary:hover {
      background-color: #c0092b; /* Darker red color on hover */
      border-color: #c0392b;
    }

    .image-container {
      width: 40%; /* Adjust the width of the image container */
    }

    .image-container img {
      width: 100%; /* Make the image fill its container */
      border-radius: 8px; /* Optional: add border radius to the image */
    }
    .container{
      position: relative;
      top: 80px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h3>FLOOD MONITORING USING MACHINE LEARNING</h3><br>
    <div class="row justify-content-md-center">
      <div class="col-md-8 form-container">
        <form action="result">
          {% csrf_token %}
          <div class="form-group row">
            <label for="year" class="col-sm-2 col-form-label form-label">YEAR:</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="year" placeholder="YEAR :" name="YEAR" required>
            </div>
          </div>
          <!-- Add input fields for each month -->
          <div class="form-group row">
            <label for="jan" class="col-sm-2 col-form-label form-label">JAN:</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="jan" placeholder="JAN :" name="JAN" required>
            </div>
          </div>
          <!-- Add similar input fields for other months -->
          <div class="form-group row">
            <label for="feb" class="col-sm-2 col-form-label form-label">FEB:</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="feb" placeholder="FEB :" name="FEB" required>
            </div>
          </div>
          <div class="form-group row">
            <label for="mar" class="col-sm-2 col-form-label form-label">MAR:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="mar" placeholder="MAR :" name="MAR" required>
            </div>
        </div>
        <!-- Add similar input fields for APR to NOV -->
        <div class="form-group row">
            <label for="apr" class="col-sm-2 col-form-label form-label">APR:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="apr" placeholder="APR :" name="APR" required>
            </div>
        </div>
        <div class="form-group row">
          <label for="may" class="col-sm-2 col-form-label form-label">MAY:</label>
          <div class="col-sm-10">
              <input type="text" class="form-control" id="may" placeholder="MAY :" name="MAY" required>
          </div>
      </div>
      <div class="form-group row">
          <label for="jun" class="col-sm-2 col-form-label form-label">JUN:</label>
          <div class="col-sm-10">
              <input type="text" class="form-control" id="jun" placeholder="JUN :" name="JUN" required>
          </div>
      </div>
      <div class="form-group row">
          <label for="jul" class="col-sm-2 col-form-label form-label">JUL:</label>
          <div class="col-sm-10">
              <input type="text" class="form-control" id="jul" placeholder="JUL :" name="JUL" required>
          </div>
      </div>
      <div class="form-group row">
          <label for="aug" class="col-sm-2 col-form-label form-label">AUG:</label>
          <div class="col-sm-10">
              <input type="text" class="form-control" id="aug" placeholder="AUG :" name="AUG" required>
          </div>
      </div>
      <div class="form-group row">
          <label for="sep" class="col-sm-2 col-form-label form-label">SEP:</label>
          <div class="col-sm-10">
              <input type="text" class="form-control" id="sep" placeholder="SEP :" name="SEP" required>
          </div>
      </div>
      <div class="form-group row">
          <label for="oct" class="col-sm-2 col-form-label form-label">OCT:</label>
          <div class="col-sm-10">
              <input type="text" class="form-control" id="oct" placeholder="OCT :" name="OCT" required>
          </div>
      </div>
          <div class="form-group row">
            <label for="nov" class="col-sm-2 col-form-label form-label">NOV:</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="nov" placeholder="NOV :" name="NOV" required>
            </div>
          </div>
          <!-- Add input field for DEC -->
          <div class="form-group row">
            <label for="dec" class="col-sm-2 col-form-label form-label">DEC:</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="dec" placeholder="DEC :" name="DEC" required>
            </div>
          </div>
          <!-- Input field for annual rainfall -->
          <div class="form-group row">
            <label for="annual_rainfall" class="col-sm-2 col-form-label form-label">ANNUAL_RAIN:</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="annual_rainfall" placeholder="ANNUAL RAINFALL :" name="ANNUAL_RAINFALL" required>
            </div>
          </div>
          <div class="form-group row">
            <div class="col-sm-12">
              <button type="submit" class="btn btn-primary btn-lg btn-block">Predict</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
